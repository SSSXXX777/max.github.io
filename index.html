<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>THE WALL STREET JOURNAL STYLE KNOWLEDGE BASE</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Google Fonts 经典报业衬线与无衬线字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Retina:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Docsify 基础主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* --------------------------------------------------
       📰 华尔街日报 (WSJ) 经典报业风格定制 CSS 
       -------------------------------------------------- */
    :root {
      --theme-color: #000000;         /* 经典报业纯黑 */
      --accent-gold: #c89d5f;         /* 华尔街日报标志性淡金/棕色 */
      --bg-main: #fcfbf9;             /* 经典纸张浅米白纸感 */
      --bg-card: #ffffff;             /* 卡片纯白 */
      --text-main: #111111;           /* 极深墨黑油墨字 */
      --border-line: #333333;         /* 报纸分割线黑色 */
      --sidebar-width: 300px;
    }

    /* 全局背景与老式报业衬线字体 */
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Source Serif 4', 'Georgia', 'Noto Serif SC', serif !important;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* 侧边栏：老式报纸专栏风格 */
    .sidebar {
      background-color: #f4f2ed !important;
      border-right: 2px solid #222222 !important;
      padding-top: 20px;
    }

    /* 侧边栏顶部：华尔街日报式报头 */
    .sidebar::before {
      content: "THE WALL STREET JOURNAL.";
      display: block;
      font-family: 'Playfair Display', 'Times New Roman', serif;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: -0.5px;
      color: #000000;
      text-align: center;
      padding: 15px 10px 10px 10px;
      margin: 0 15px 15px 15px;
      border-bottom: 3px double #000000;
      text-transform: uppercase;
    }

    .sidebar h1 {
      font-family: 'Playfair Display', serif !important;
      font-size: 0.85rem !important;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #666666 !important;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .sidebar ul li a {
      color: #222222 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      border-radius: 0px;
      padding: 8px 12px !important;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
    }

    .sidebar ul li a:hover {
      background-color: #e8e4db !important;
      color: #000000 !important;
      border-left: 2px solid #000000;
    }

    .sidebar ul li.active > a {
      background-color: #000000 !important;
      color: #ffffff !important;
      font-weight: bold;
      border-left: 2px solid var(--accent-gold);
    }

    /* 主内容区域：经典报章排版 */
    .content {
      padding-top: 30px;
    }

    .markdown-section {
      max-width: 860px !important;
      background: var(--bg-card);
      padding: 55px 60px !important;
      border: 1px solid #dcd7ce;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      margin-bottom: 50px;
      position: relative;
    }

    /* 顶部报刊日期与期号双横线顶线 */
    .markdown-section::before {
      content: "VOL. CCXXXI NO. 42  |  FINANCIAL & KNOWLEDGE EDITION";
      display: block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #555555;
      padding-bottom: 8px;
      margin-bottom: 25px;
      border-bottom: 1px solid #000000;
    }

    /* 报纸主大标题 Header */
    .markdown-section h1 {
      font-family: 'Playfair Display', 'Times New Roman', serif !important;
      font-weight: 900;
      font-size: 2.6rem;
      line-height: 1.15;
      color: #000000 !important;
      border-bottom: 2px solid #000000;
      padding-bottom: 15px;
      margin-top: 10px;
      letter-spacing: -0.5px;
    }

    .markdown-section h2 {
      font-family: 'Playfair Display', serif !important;
      font-weight: 700;
      font-size: 1.65rem;
      color: #111111 !important;
      border-bottom: 1px solid #000000;
      padding-bottom: 6px;
      margin-top: 35px;
    }

    .markdown-section h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #333333 !important;
      margin-top: 25px;
    }

    /* 首字下沉 (Drop Cap) 效果 */
    .markdown-section > p:first-of-type::first-letter {
      font-family: 'Playfair Display', serif;
      font-size: 3.8rem;
      float: left;
      line-height: 0.8;
      margin-right: 10px;
      margin-top: 4px;
      color: #000000;
      font-weight: 900;
    }

    /* 华尔街日报经典社论/社评引用框 (Pull Quote) */
    .markdown-section blockquote {
      background-color: #f9f8f5 !important;
      border-left: none !important;
      border-top: 2px solid #000000 !important;
      border-bottom: 2px solid #000000 !important;
      color: #222222 !important;
      font-family: 'Playfair Display', serif !important;
      font-style: italic;
      font-size: 1.25rem;
      line-height: 1.5;
      padding: 20px 25px !important;
      margin: 30px 0 !important;
    }

    /* 报纸图表式表格 */
    .markdown-section table {
      border-collapse: collapse !important;
      width: 100%;
      margin: 25px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.95rem;
    }

    .markdown-section th {
      background-color: #f0ede6 !important;
      color: #000000 !important;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      border-top: 2px solid #000000 !important;
      border-bottom: 2px solid #000000 !important;
      padding: 10px !important;
    }

    .markdown-section td {
      border-top: 1px solid #e0dbcf !important;
      border-bottom: 1px solid #e0dbcf !important;
      padding: 10px !important;
    }

    /* 代码块：优雅严肃的暗黑色调 */
    .markdown-section pre {
      background-color: #1a1a1a !important;
      color: #f0f0f0 !important;
      border-radius: 0px !important;
      border-left: 4px solid var(--accent-gold);
    }

    /* 极简灰黑色滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #888888;
    }
    ::-webkit-scrollbar-track {
      background: #f4f2ed;
    }
  </style>
</head>
<body>
  <div id="app">THE WALL STREET JOURNAL — LOADING KNOWLEDGE EDITION...</div>
  <script>
    window.$docsify = {
      name: 'EXECUTIVE BRIEFING',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'SEARCH ARCHIVES...',
        noData: 'NO ARTICLES FOUND',
        depth: 3
      }
    }
  </script>
  <!-- Docsify 核心库与扩展插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
